name: vistar_app
description: Vistar Logitek - KRA Review & Incentive Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Browser APIs for the web build — used to download a proof attachment
  # (Blob + object URL) so a reporting manager can open the employee's evidence.
  # Already present transitively; declared directly because we import it.
  web: ^1.1.1

  # State management
  flutter_riverpod: ^2.4.9

  # Routing
  go_router: ^13.0.0

  # Networking
  dio: ^5.4.0

  # Secure token storage
  flutter_secure_storage: ^9.0.0

  # Local key-value persistence (non-secrets — used for self-rate
  # auto-save / draft resume in the Employee module).
  shared_preferences: ^2.2.2

  # Connectivity awareness
  connectivity_plus: ^5.0.2

  # UI
  google_fonts: ^6.1.0
  shimmer: ^3.0.0

  # Utilities
  intl: ^0.19.0

  # File attachment picker (self-rate "proof" — local-only for now)
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Launcher-icon generation (build-time only, never shipped). Regenerate with:
  #   dart run tool/make_app_icon.dart && dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.13.1

  # Used only by tool/make_app_icon.dart to letterbox the logo onto a square
  # canvas. Declared directly rather than leaned on transitively.
  image: ^4.1.7

# Launcher icons are generated from a SQUARE source, produced by
# tool/make_app_icon.dart. The brand logo is a wide 3:2 wordmark, so it is
# letterboxed onto a square white canvas rather than resized — resizing a 3:2
# image into a square stretches the wordmark.
flutter_launcher_icons:
  image_path: "assets/icons/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
  # Adaptive icon: Android crops a circle/squircle out of the foreground, so the
  # padded canvas is what keeps the wordmark from being clipped at the edges.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    # Listed explicitly so the asset bundle picks up new files even when
    # the cached AssetManifest from an earlier `flutter run` wouldn't.
    - assets/images/logo.png
    - assets/images/vistar_logo.png
